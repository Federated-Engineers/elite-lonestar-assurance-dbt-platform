
name: dbt-ci

on:
  pull_request:
  branches: [ main ]
  paths: 
    - "dbt-transformations/**"

jobs:
  dbt-ci:
    runs-on: ubuntu-latest
    steps:
      - name: checkout code
        uses: actions/checkout@v4
      
      - name: Install requirements
        run: pip install -r requirements.txt  

      - name: build image
        run: docker build --platform linux/amd64 -t lonestar-dbt:ci dbt-transformations

      - name: Lint models
        run: "sqlfluff lint lonestar/models"
