
name: dbt-ci

on:
  pull_request:
    branches: [ main ]
    paths: 
      - "dbt-transformations/**"

jobs:
  dbt-ci:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: dbt-transformations
    steps:
      - name: checkout code
        uses: actions/checkout@v4

      - name: setup python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      
      - name: Install requirements
        run: pip install -r requirements.txt

      - name: Lint models
        run: "sqlfluff lint lonestar/models"
