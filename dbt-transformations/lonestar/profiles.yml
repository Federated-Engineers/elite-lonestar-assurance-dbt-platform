
lonestar:
  target: test
  outputs:
    test:
      type: snowflake
      account: "{{ env_var('DBT_SNOWFLAKE_ACCOUNT') }}"
      user: "{{ env_var('USER') }}"
      role: "{{ env_var('ROLE') }}"
      warehouse: "{{ env_var('WAREHOUSE') }}"
      database: "{{ env_var('DATABASE') }}"
      schema: "{{ env_var('SCHEMA')}}"
      authenticator: snowflake_jwt
      private_key: "{{ env_var('SNOWFLAKE_DBT_PRIVATE_KEY') }}"
      threads: 4

    ci:
      type: snowflake
      account: "{{ env_var('DBT_SNOWFLAKE_ACCOUNT') }}"
      user: "{{ env_var('USER') }}"
      role: "{{ env_var('ROLE') }}"
      warehouse: "{{ env_var('WAREHOUSE') }}"
      database: "{{ env_var('DATABASE') }}"
      schema: "{{ env_var('SCHEMA')}}"
      authenticator: snowflake_jwt
      private_key: "{{ env_var('SNOWFLAKE_DBT_PRIVATE_KEY') }}"
      threads: 4
    

    production:
      type: snowflake
      account: "{{ env_var('DBT_SNOWFLAKE_ACCOUNT') }}"
      user: "{{ env_var('USER') }}"
      role: "{{ env_var('ROLE') }}"
      warehouse: "{{ env_var('WAREHOUSE') }}"
      database: "{{ env_var('DATABASE') }}"
      schema: "{{ env_var('SCHEMA')}}"
      authenticator: snowflake_jwt
      private_key: "{{ env_var('SNOWFLAKE_DBT_PRIVATE_KEY') }}"
      threads: 4
    
